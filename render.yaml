services:
  - type: web
    name: youtube-rag-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: COLLECTION_NAME
        value: youtube_knowledge
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: DEFAULT_CHUNK_SIZE
        value: "500"
      - key: DEFAULT_CHUNK_OVERLAP
        value: "60"
      - key: PYTHON_VERSION
        value: "3.12.7"
